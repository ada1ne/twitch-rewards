name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - deploy-test

jobs:
  build-and-push-images:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      # This action sets up BuildKit for advanced features like multi-platform builds
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      # Authenticates with your Docker Hub credentials
      uses: docker/login-action@v3
      with:
        username: ${{ vars.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push production image
      # Builds the image using your Dockerfile and pushes it to the registry
      uses: docker/build-push-action@v6
      with:
        context: . # The build context is the root of your repo
        push: true # Pushes the image if build is successful
        tags: ${{ vars.DOCKER_USERNAME }}/${{ vars.DOCKERHUB_REPO }}:latest

  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        # Add the private key to the SSH agent
        echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # Add the Droplet's host key to known_hosts to prevent SSH prompts
        ssh-keyscan ${{ vars.DO_SSH_HOST }} >> ~/.ssh/known_hosts

