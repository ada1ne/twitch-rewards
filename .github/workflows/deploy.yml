  deploy:
    runs-on: ubuntu-latest
#    needs: build-and-push-images

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        # Add the private key to the SSH agent
        echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # Add the Droplet's host key to known_hosts to prevent SSH prompts
        ssh-keyscan ${{ vars.DO_SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to server
      run: |
        rm .env
        echo "SSL_KEY_PATH=${{ secrets.SSL_KEY_PATH }}" >> .env
        echo "SSL_CERTIFICATE_PATH=${{ secrets.SSL_CERTIFICATE_PATH }}" >> .env
        echo "JWT_ENCODING_ALGORITHM=${{ secrets.JWT_ENCODING_ALGORITHM }}" >> .env
        echo "JWT_EXPIRATION_TIME_IN_SECONDS=${{ secrets.JWT_EXPIRATION_TIME_IN_SECONDS }}" >> .env
        echo "JWT_ENCODING_KEY=${{ secrets.JWT_ENCODING_KEY }}" >> .env
        echo "TWITCH_APP_CLIENT_ID=${{ secrets.TWITCH_APP_CLIENT_ID }}" >> .env
        echo "TWITCH_APP_CLIENT_SECRET=${{ secrets.TWITCH_APP_CLIENT_SECRET }}" >> .env
        echo "APP_HOST=${{ secrets.APP_HOST }}" >> .env
        echo "APP_PORT=${{ secrets.APP_PORT }}" >> .env
        echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
        echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
        echo "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" >> .env
        echo "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" >> .env
        echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env

        scp docker-compose.yml .env ${{ secrets.DO_SSH_USER }}@${{ vars.DO_SSH_HOST }}:/var/www/twitch-rewards
        ssh -i ~/.ssh/id_ed25519 ${{ secrets.DO_SSH_USER }}@${{ vars.DO_SSH_HOST }} << 'EOF'
        cd /var/www/twitch-rewards
        docker compose up -d
        EOF
