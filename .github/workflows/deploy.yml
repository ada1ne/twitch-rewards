  deploy:
    runs-on: ubuntu-latest
#    needs: build-and-push-images

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup SSH
      run: |
        mkdir -p ~/.ssh
        # Add the private key to the SSH agent
        echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        # Add the Droplet's host key to known_hosts to prevent SSH prompts
        ssh-keyscan ${{ vars.DO_SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to server
      env:
        SSL_KEY_PATH: ${{ secrets.SSL_KEY_PATH }}
        SSL_CERTIFICATE_PATH: ${{ secrets.SSL_CERTIFICATE_PATH }}
        JWT_ENCODING_ALGORITHM: ${{ secrets.JWT_ENCODING_ALGORITHM }}
        JWT_EXPIRATION_TIME_IN_SECONDS: ${{ secrets.JWT_EXPIRATION_TIME_IN_SECONDS }}
        JWT_ENCODING_KEY: ${{ secrets.JWT_ENCODING_KEY }}
        TWITCH_APP_CLIENT_ID: ${{ secrets.TWITCH_APP_CLIENT_ID }}
        TWITCH_APP_CLIENT_SECRET: ${{ secrets.TWITCH_APP_CLIENT_SECRET }}
        APP_HOST: ${{ secrets.APP_HOST }}
        APP_PORT: ${{ secrets.APP_PORT }}
        POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
        POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
        POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
        POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      run: |
        scp docker-compose.yml .env ${{ secrets.DO_SSH_USER }}@${{ vars.DO_SSH_HOST }}:/var/www/twitch-rewards
        ssh -i ~/.ssh/id_ed25519 ${{ secrets.DO_SSH_USER }}@${{ vars.DO_SSH_HOST }} << 'EOF'
        cd /var/www/twitch-rewards
        docker compose up -d
        echo HEY
        echo $APP_PORT
        EOF
